name: Build Z8803BE eMMC 25.12.5 (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-yaml rsync unzip zlib1g-dev file wget curl patch swig time cmake ninja-build ccache libelf-dev u-boot-tools squashfs-tools
      - name: Clone pinned official OpenWrt source
        run: |
          set -eu
          git clone --depth 1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt rev-parse HEAD | tee source-commit.txt
      - name: Stage custom eMMC board DTS and device recipe
        shell: bash
        run: |
          set -euo pipefail
          src=devices/z8803be-emmc/mt7988a-zbt-z8803be-emmc-vendor-fixed-draft.dts
          dest=openwrt/target/linux/mediatek/dts/mt7988a-zbt-z8803be-emmc-vendor-fixed-draft.dts
          cp "$src" "$dest"
          if ! test -f openwrt/target/linux/mediatek/dts/mt7988.dtsi && test -f openwrt/target/linux/mediatek/dts/mt7988a.dtsi; then
            sed -i 's/#include "mt7988.dtsi"/#include "mt7988a.dtsi"/' "$dest"
          fi
          grep -q 'zbtlink,zbt-z8803be,mt7988a-emmc' "$dest"
          test -f openwrt/target/linux/mediatek/image/filogic.mk
          if grep -q 'define Device/zbtlink_zbt-z8803be-emmc' openwrt/target/linux/mediatek/image/filogic.mk; then
            echo 'Device recipe already exists; refusing duplicate' >&2; exit 1
          fi
          cat devices/z8803be-emmc/filogic-device-block.mk >> openwrt/target/linux/mediatek/image/filogic.mk
          echo 'Staged DTS includes:'
          grep '^#include' "$dest"
      - name: Install feeds and select target
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../devices/z8803be-emmc/config.seed .config
          make defconfig
          grep -Fx 'CONFIG_TARGET_mediatek_filogic_DEVICE_zbtlink_zbt-z8803be-emmc=y' .config
      - name: Download sources
        run: |
          cd openwrt
          make download -j2
      - name: Build firmware
        shell: bash
        run: |
          cd openwrt
          make -j2 V=s 2>&1 | tee ../build.log
      - name: Inspect firmware archive and device metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/unpacked
          fw=$(find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -name '*zbt-z8803be-emmc*sysupgrade.bin' -print -quit)
          test -n "$fw"
          echo "$fw" > review/image-path.txt
          sha256sum "$fw" > review/sha256sum.txt
          tar -tf "$fw" > review/archive-list.txt
          tar -xf "$fw" -C review/unpacked
          kernel=$(find review/unpacked -type f -name kernel -print -quit)
          root=$(find review/unpacked -type f -name root -print -quit)
          test -n "$kernel" && test -n "$root"
          test "$(stat -c%s "$kernel")" -le 33554432
          test "$(stat -c%s "$root")" -le 7471628288
          dumpimage -l "$kernel" > review/kernel-fit.txt
          file "$root" > review/root-file.txt
          file "$kernel" > review/kernel-file.txt
          fwtool=openwrt/staging_dir/host/bin/fwtool
          test -x "$fwtool"
          "$fwtool" -i review/metadata.json "$fw"
          grep -Fq 'zbtlink,zbt-z8803be,mt7988a-emmc' review/metadata.json
          echo 'PASS: structural image validation only – NOT certified safe to flash' > review/STATUS.txt
      - name: Collect debug outputs
        if: always()
        shell: bash
        run: |
          mkdir -p review
          test -f build.log && tail -n 300 build.log > review/build-tail.txt || true
          test -f openwrt/.config && cp openwrt/.config review/config.build || true
          test -f source-commit.txt && cp source-commit.txt review/ || true
      - name: Upload build and verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z8803be-emmc-experimental-build
          path: |
            openwrt/bin/targets/mediatek/filogic/*zbt-z8803be-emmc*sysupgrade.bin
            review/**
          if-no-files-found: warn
