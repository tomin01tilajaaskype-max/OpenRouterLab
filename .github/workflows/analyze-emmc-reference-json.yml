{"name":"Analyze Z8803BE eMMC Reference Firmware","on":{"workflow_dispatch":null},"permissions":{"contents":"read"},"jobs":{"analyze":{"runs-on":"ubuntu-24.04","env":{"IMAGE_URL":"https://raw.githubusercontent.com/OneB1t/Z8803BE-research/main/openwrt/openwrt-mediatek-mt7988-zbt-z8803be-emmc-2sim-25.0710_094429.bin","IMAGE_FILE":"z8803be-emmc-2sim-reference.bin"},"steps":[{"name":"Checkout repository","uses":"actions/checkout@v4"},{"name":"Install tools","run":"sudo apt-get update\nsudo apt-get install -y binwalk device-tree-compiler file squashfs-tools u-boot-tools xxd"},{"name":"Download firmware","run":"mkdir -p output\ncurl -fL --retry 3 \"$IMAGE_URL\" -o \"output/$IMAGE_FILE\"\nls -lh \"output/$IMAGE_FILE\"\nsha256sum \"output/$IMAGE_FILE\" > output/sha256sum.txt"},{"name":"Inspect firmware","run":"{\n  echo \"# Z8803BE eMMC reference firmware analysis\"\n  echo\n  echo \"## File identification\"\n  file \"output/$IMAGE_FILE\"\n  echo\n  echo \"## SHA-256\"\n  cat output/sha256sum.txt\n  echo\n  echo \"## First 256 bytes\"\n  xxd -l 256 \"output/$IMAGE_FILE\"\n  echo\n  echo \"## Binwalk scan\"\n  binwalk \"output/$IMAGE_FILE\" || true\n  echo\n  echo \"## Interesting strings\"\n  strings -a \"output/$IMAGE_FILE\" | grep -iE \"z8803be|emmc|rootfs|kernel|fip|factory|fit|squashfs|ubi|mmcblk\" | head -n 300 || true\n} > output/z8803be-emmc-reference-analysis.txt"},{"name":"Upload report","uses":"actions/upload-artifact@v4","with":{"name":"z8803be-emmc-reference-analysis","path":"output/z8803be-emmc-reference-analysis.txt\noutput/sha256sum.txt","retention-days":30}}]}}}