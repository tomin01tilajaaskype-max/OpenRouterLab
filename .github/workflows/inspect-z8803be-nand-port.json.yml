{"name":"Inspect Z8803BE NAND Port Source","on":{"workflow_dispatch":{}},"permissions":{"contents":"read"},"jobs":{"inspect":{"runs-on":"ubuntu-24.04","steps":[{"name":"Checkout OpenRouterLab","uses":"actions/checkout@v4"},{"name":"Clone 0xFar5eer source tree","run":"git clone --depth=1 https://github.com/0xFar5eer/openwrt25.12_ZBT_Z8803BE.git source"},{"name":"Create source report","run":"mkdir -p output\n{\n  echo \"# Z8803BE NAND-port source inventory\"\n  echo\n  echo \"## Commit\"\n  git -C source log -1 --oneline\n  echo\n  echo \"## Candidate Z8803BE files\"\n  find source -type f \\( -iname '*z8803be*' -o -iname '*8803be*' \\) -printf '%P\\n' | sort\n  echo\n  echo \"## filogic.mk matching lines\"\n  grep -n -A45 -B8 -E 'zbt-z8803be|zbtlink_zbt-z8803be' source/target/linux/mediatek/image/filogic.mk || true\n  echo\n  echo \"## MT7996 and MediaTek-related feeds\"\n  grep -n -E 'mediatek|mt76|mt799|qmodem' source/feeds.conf.default || true\n  echo\n  echo \"## DTS storage-related lines\"\n  while IFS= read -r f; do\n    echo\n    echo \"### $f\"\n    grep -n -E 'spi_nand|spi-nand|snfi|ubi|mmc@|mmc-hs|rootfs|kernel|factory|fip|compatible|memory' \"source/$f\" || true\n  done < <(find source/target/linux/mediatek/dts -type f -iname '*z8803be*.dts' -printf '%P\\n' | sort)\n} > output/z8803be-nand-port-report.txt\n\nfind source/target/linux/mediatek/dts -type f -iname '*z8803be*.dts' -print -exec cp --parents {} output/ \\; || true\ncp source/target/linux/mediatek/image/filogic.mk output/filogic.mk || true\ncp source/feeds.conf.default output/feeds.conf.default || true"},{"name":"Upload report","uses":"actions/upload-artifact@v4","with":{"name":"z8803be-nand-port-source","path":"output","retention-days":30}}]}}}