{"name":"Build Z8803BE eMMC Structural Image","on":{"workflow_dispatch":{}},"permissions":{"contents":"read"},"jobs":{"build":{"runs-on":"ubuntu-24.04","env":{"SOURCE_REPO":"https://github.com/0xFar5eer/openwrt25.12_ZBT_Z8803BE.git","SOURCE_DIR":"openwrt","DEVICE_DIR":"devices/z8803be-emmc","DEVICE_ID":"zbt-z8803be-emmc","BOARD_NAME":"zbt-z8803be-emmc"},"steps":[{"name":"Checkout OpenRouterLab","uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"name":"Install build dependencies","run":"sudo apt-get update\nsudo apt-get install -y \\\n  ack antlr3 asciidoc autoconf automake autopoint \\\n  binutils bison build-essential ccache clang cmake cpio curl \\\n  device-tree-compiler ecj fastjar flex gawk gettext \\\n  gcc-multilib g++-multilib git gperf haveged help2man intltool \\\n  libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \\\n  libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \\\n  libssl-dev libtool lz4 p7zip-full patch python3 python3-pip \\\n  rsync swig texinfo unzip wget xsltproc zlib1g-dev file"},{"name":"Verify Z8803BE eMMC project files","run":"test -f \"$DEVICE_DIR/mt7988a-zbtlink-zbt-z8803be-emmc.dts\"\ntest -f \"$DEVICE_DIR/filogic-device-block.mk\"\ntest -f \"$DEVICE_DIR/config.seed\"\n\necho \"Device files found:\"\nfind \"$DEVICE_DIR\" -maxdepth 1 -type f -printf \"%f\\n\" | sort"},{"name":"Verify board-name consistency","run":"grep -Fq \"define Device/$DEVICE_ID\" \"$DEVICE_DIR/filogic-device-block.mk\"\ngrep -Fq \"TARGET_DEVICES += $DEVICE_ID\" \"$DEVICE_DIR/filogic-device-block.mk\"\ngrep -Fq \"CONFIG_TARGET_mediatek_filogic_DEVICE_$DEVICE_ID=y\" \"$DEVICE_DIR/config.seed\"\n\necho \"Expected board name: $BOARD_NAME\"\necho \"Expected device ID:  $DEVICE_ID\" "},{"name":"Clone MediaTek Z8803BE source base","run":"git clone --depth=1 \"$SOURCE_REPO\" \"$SOURCE_DIR\"\ngit -C \"$SOURCE_DIR\" log -1 --oneline"},{"name":"Install eMMC DTS and device block","run":"DTS_NAME=\"mt7988a-zbtlink-zbt-z8803be-emmc.dts\"\nDTS_DEST=\"$SOURCE_DIR/target/linux/mediatek/dts/$DTS_NAME\"\nMK_DEST=\"$SOURCE_DIR/target/linux/mediatek/image/filogic.mk\"\n\ninstall -Dm644 \"$DEVICE_DIR/$DTS_NAME\" \"$DTS_DEST\"\n\nif ! grep -Fq \"define Device/$DEVICE_ID\" \"$MK_DEST\"; then\n  printf \"\\n\\n# OpenRouterLab Z8803BE eMMC research device\\n\" >> \"$MK_DEST\"\n  cat \"$DEVICE_DIR/filogic-device-block.mk\" >> \"$MK_DEST\"\nfi\n\ngrep -n -A35 -B2 \"define Device/$DEVICE_ID\" \"$MK_DEST\"\nls -lh \"$DTS_DEST\" "},{"name":"Update and install feeds","run":"cd \"$SOURCE_DIR\"\n./scripts/feeds update -a\n./scripts/feeds install -a"},{"name":"Install eMMC configuration","run":"cp \"$DEVICE_DIR/config.seed\" \"$SOURCE_DIR/.config\"\ncd \"$SOURCE_DIR\"\nmake defconfig\ngrep -E \"^CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE_ID}=y$\" .config"},{"name":"Cache downloads and compiler objects","uses":"actions/cache@v4","with":{"path":"openwrt/dl\nopenwrt/.ccache","key":"${{ runner.os }}-z8803be-emmc-${{ hashFiles('devices/z8803be-emmc/**') }}","restore-keys":"${{ runner.os }}-z8803be-emmc-"}},{"name":"Download source archives","run":"cd \"$SOURCE_DIR\"\nmake download -j\"$(nproc)\" "},{"name":"Build structural firmware image","run":"cd \"$SOURCE_DIR\"\nmake -j\"$(nproc)\" || make -j1 V=s"},{"name":"Validate generated sysupgrade archive","run":"set -euo pipefail\nmkdir -p artifacts/unpacked\n\nSYSUPGRADE=\"$(find \"$SOURCE_DIR/bin/targets/mediatek/filogic\" -maxdepth 1 -type f -iname '*zbt-z8803be-emmc*sysupgrade*.bin' -print -quit)\"\ntest -n \"$SYSUPGRADE\"\n\necho \"Sysupgrade file: $SYSUPGRADE\" | tee artifacts/validation.txt\nfile \"$SYSUPGRADE\" | tee -a artifacts/validation.txt\nsha256sum \"$SYSUPGRADE\" | tee -a artifacts/validation.txt\n\ntar -tf \"$SYSUPGRADE\" | tee artifacts/sysupgrade-file-list.txt\ntar -xf \"$SYSUPGRADE\" -C artifacts/unpacked\n\nCONTROL=\"$(find artifacts/unpacked -type f -name CONTROL -print -quit)\"\nKERNEL=\"$(find artifacts/unpacked -type f -name kernel -print -quit)\"\nROOT=\"$(find artifacts/unpacked -type f -name root -print -quit)\"\n\ntest -n \"$CONTROL\"\ntest -n \"$KERNEL\"\ntest -n \"$ROOT\"\n\necho >> artifacts/validation.txt\necho \"CONTROL:\" | tee -a artifacts/validation.txt\ncat \"$CONTROL\" | tee -a artifacts/validation.txt\ngrep -Fxq \"BOARD=$BOARD_NAME\" \"$CONTROL\"\n\necho >> artifacts/validation.txt\necho \"Kernel:\" | tee -a artifacts/validation.txt\nfile \"$KERNEL\" | tee -a artifacts/validation.txt\n\necho \"Root:\" | tee -a artifacts/validation.txt\nfile \"$ROOT\" | tee -a artifacts/validation.txt\n\necho \"PASS: sysupgrade archive contains CONTROL, kernel and root for $BOARD_NAME.\" | tee -a artifacts/validation.txt"},{"name":"Upload build and validation artifacts","if":"always()","uses":"actions/upload-artifact@v4","with":{"name":"z8803be-emmc-structural-build","path":"artifacts\nopenwrt/bin/targets/mediatek/filogic","if-no-files-found":"warn","retention-days":14}}]}}}